
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ükho - Connect Your Roots</title>
    <link rel="icon" type="image/png" href="input_file_0.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfaf8;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e1b1a;
            --text-dim: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .dark-theme {
            --bg-color: #120b08;
            --panel-bg: rgba(35, 25, 20, 0.75);
            --text-main: #f7f3f1;
            --text-dim: #94a3b8;
            --border-color: rgba(245, 158, 11, 0.15);
            --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .ukho-gradient {
            background: linear-gradient(135deg, #f97316 0%, #a855f7 100%);
        }
        
        .ukho-glow {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.2);
        }
        
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .ancestral-gold {
            color: #f59e0b;
        }
        
        .clan-border {
            border-left: 4px solid #d97706;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(249, 115, 22, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(249, 115, 22, 0.3);
        }
    </style>
